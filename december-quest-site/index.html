(function (root, factory) {

  const active = t => t.mode==='pass'?[]:t.legs.filter(l=>l.enabled);
  const fixtureKey = leg => (leg.fixtureId?.trim() || [leg.home.trim().toLowerCase(),leg.away.trim().toLowerCase()].sort().join('|')+'|'+leg.kickoff.slice(0,10)).replace(/\s+/g,'').toLowerCase();
  const canonicalTeam = s => String(s||'').normalize('NFKD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').replace(/\b(fc|cf|sc|afc)\b/g,'').replace(/\s+/g,' ').trim();
  const sameGameKey = l => {
    const names=[canonicalTeam(l.home),canonicalTeam(l.away)].sort(),day=String(l.kickoff||'').slice(0,10);
    return names[0]&&names[1]&&names[0]!==names[1]&&/^2026-12-\d\d$/.test(day)?names.join('|')+'|'+day:null;
  };
  const independent = legs => legs.length>0&&legs.every(x=>sameGameKey(x))&&new Set(legs.map(sameGameKey)).size===legs.length&&new Set(legs.map(l=>String(l.fixtureId||'').toLowerCase()).filter(Boolean)).size===legs.filter(l=>String(l.fixtureId||'').trim()).length;
  function odds(t){const a=active(t); if(!a.length||a.some(l=>!Number.isFinite(l.odds)||l.odds<=1))return null;return Math.round(a.reduce((n,l)=>n*l.odds,1)*10000)/10000;}
  function modelP(t){const a=active(t);if(!a.length||(a.length>1&&!t.independenceReviewed)||!independent(a)||a.some(l=>!Number.isFinite(l.prob)||l.prob<=0||l.prob>100))return null;return a.reduce((p,l)=>p*l.prob/100,1);}
  function stake(t,s){return t.mode==='pass'?0:(Number.isFinite(s.stake)?s.stake:STAKE);}
  function price(t,s){return t.purchased?(Number.isFinite(s.price)?s.price:PRICE):0;}
  function ev(t,s){if(t.mode==='pass')return -price(t,s);const p=modelP(t),o=odds(t);return p===null||o===null?null:round(p*o*stake(t,s)-stake(t,s)-price(t,s));}
  function legFactor(l){const o=l.odds;switch(l.status){case'win':return o;case'lose':return 0;case'return':return 1;case'half-win':return 1+(o-1)/2;case'half-loss':return .5;default:return null;}}
  function payoutFactor(legs){
    if(!legs.length)return null;
    if(legs.some(leg=>leg.status==='lose'))return 0;
    const factors=legs.map(legFactor);
    return factors.some(factor=>factor===null)?null:factors.reduce((combined,factor)=>combined*factor,1);

  function payout(t,s){
    if(t.mode==='pass')return 0;
    if(t.manualPayout!==null&&Number.isFinite(t.manualPayout))return t.manualPayout;
    const factor=payoutFactor(active(t));
    return factor===null?null:round(factor*stake(t,s));
  }
  function flatReplay(tours){
    const opening=100,summary=Object.fromEntries([1,2,3].map(n=>[n,{n:0,pnl:0}]));

  function outcome(t,s){if(t.state!=='closed')return null;if(t.mode==='pass')return 'pass';const p=payout(t,s),a=active(t);if(p===null)return null;if(p===0)return 'lose';if(a.length&&a.every(l=>l.status==='win'))return 'win';if(a.every(l=>l.status==='return'))return 'return';return 'partial';}
  function validateSeal(t,now=new Date()){
    const errors=[];
    if(t.mode==='pass'){if(!t.decisionNote.trim())errors.push('Для PASS укажи причину решения.');return errors;}
    const a=active(t),min=t.mode==='single'?1:2,max=t.mode==='single'?1:3;
    if(a.length<min||a.length>max)errors.push(`Для этого режима требуется ${min===max?min:'2–3'} участвующих событий.`);

      if(!l.home.trim()||!l.away.trim()||l.home.trim().toLowerCase()===l.away.trim().toLowerCase())errors.push(`Нога ${i+1}: укажи двух разных участников.`);
      if(!l.market||!l.pick.trim())errors.push(`Нога ${i+1}: укажи рынок и исход.`);
      if(!Number.isFinite(l.odds)||l.odds<=1)errors.push(`Нога ${i+1}: коэффициент должен быть больше 1.`);
      if(!l.kickoff||isNaN(new Date(l.kickoff).getTime()))errors.push(`Нога ${i+1}: укажи дату и время старта.`);
      else if(new Date(l.kickoff).getTime()<=now.getTime())errors.push(`Нога ${i+1}: прематч-фиксация после kickoff запрещена.`);
      if(l.prob!==null&&(!Number.isFinite(l.prob)||l.prob<=0||l.prob>100))errors.push(`Нога ${i+1}: P модели должна быть от 0 до 100%.`);

    if(a.length>=2&&!t.independenceReviewed)errors.push('Подтверди отдельную проверку возможных зависимостей между ногами.');

function rulesView(){const rules=[['PREMATCH ONLY','Все решения фиксируются до старта. Лайв и догон исключены.'],['EV важнее коэффициента','Модельная вероятность — независимый показатель. Если P модели неизвестна, EV не объявляется.'],['Экспресс 2–3 ноги','Не добавляем третью ногу ради красивого коэффициента; связанные ноги в одном матче запрещены.'],['Big Markets сначала','Исходы, двойной шанс, DNB, форы, тоталы, ОЗ, индивидуальные тоталы.'],['Small Markets только если чище','Угловые, фолы, удары; для ЖК отдельная строгая проверка.'],['Фолы ≠ ЖК','Фолы — действия игроков, жёлтые карточки — решение судьи.'],['Referee Gate','Судья подтверждён; YC/game и YC/foul; низкий риск 0–1 ЖК; правила расчёта БК; нет более чистого рынка; EV подтверждён.'],['Death-test','Одна неоправданно рискованная нога разрушает весь экспресс.'],['Данные и честность','Никаких подставных результатов, утечки будущих исходов, изменения запечатанных прогнозов.'],['PASS — законный выбор','Покупка прогноза не заставляет дополнительно ставить 1000 грн.']];return `${subtitle('Регламент игры','Официальные правила декабрьского сезона. Игровые очки измеряют дисциплину аналитика, а не готовность рисковать.')}

function exportFile(filename,content,mime){const blob=new Blob([content],{type:mime});const u=URL.createObjectURL(blob);const link=document.createElement('a');link.href=u;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);}

 else if(action==='setting'&&!E.analytics(data).seal){const n=Number(value);if(value!==''&&Number.isFinite(n)&&n>=(field==='stake'?1:0)){data.settings[field]=n;save();}}
});

function makeScenario(legs,label){return {label,note:'',legs:legs.map(l=>({id:E.id(),enabled:l.enabled!==false,home:l.home,away:l.away,fixtureId:l.fixtureId,kickoff:l.kickoff,market:l.market,pick:l.pick,odds:l.odds,prob:l.prob,status:'pending'}))};}
function scenarioComputed(t,sc){if(!sc?.legs?.length)return null;const shadow={...t,mode:sc.legs.length===1?'single':'original',legs:sc.legs,manualPayout:null};if(E.active(shadow).some(x=>x.status==='pending'))return null;const pay=E.payout(shadow,B.data().settings);return pay===null?null:{payout:pay,pnl:E.round(pay-B.data().settings.stake-(t.purchased?B.data().settings.price:0))};}
function scenarioEditor(t,kind){const sc=t[kind];const label=kind==='baseline'?'Каппер: оригинальный купон':'Альтернативный ординар';if(!sc)return `<div class="empty small-empty">${kind==='baseline'?'Оригинал ещё не зафиксирован.':'Альтернативный рынок ещё не выбран.'}</div>`;

return subtitle('Дуэль стратегий','Честно сравниваем оригинал каппера, наше решение и альтернативный одиночный рынок. Только после результатов и без подгонки коэффициентов.')+`<section class="panel mt-3">${dayPicker()}<div class="duel-columns mt-3"><div class="duel-tile"><span>Оригинал каппера</span><strong class="${original?.pnl>=0?'positive':'negative'}">${original?money(original.pnl):'Н/Д'}</strong></div><div class="duel-tile"><span>Наше решение</span><strong class="${main>=0?'positive':'negative'}">${main!==null?money(main):'Н/Д'}</strong></div><div class="duel-tile"><span>Альтернативный ординар</span><strong class="${alternative?.pnl>=0?'positive':'negative'}">${alternative?money(alternative.pnl):'Н/Д'}</strong></div></div><p class="footnote">Каждый столбец моделируется как отдельная стратегия с одинаковым флэтом и одной оплатой прогноза. Не суммируй эти три результата как реальные деньги.</p>${t.state==='draft'?`<div class="actions-row mt-2">${button('capture-original','Сохранить исходный экспресс','secondary')}${button('capture-alternative','Создать альтернативу из 1-й ноги','secondary')}</div><div class="muted small mt-1">До PREMATCH SEAL можно сохранить оригинал, затем отредактировать выбранные ноги в разделе «Тур». Исходные коэффициенты нельзя переписывать после фиксации.</div>`:''}<div class="scenario-grid mt-2">${scenarioEditor(t,'baseline')}${scenarioEditor(t,'alternate')}</div>${t.state==='draft'&&t.alternate?.legs?.length?`<section class="panel inset-panel mt-2"><h3>Изменить альтернативный рынок до фиксации</h3><div class="form-grid two">${[['home','Команда A'],['away','Команда B'],['market','Рынок'],['pick','Исход'],['odds','Коэффициент'],['kickoff','Старт (по устройству)']].map(([k,label])=>`<label class="field"><span>${label}</span>${k==='market'?`<select data-extra="alt-field" data-field="market">${E.markets.map(v=>option(v,v,t.alternate.legs[0].market)).join('')}</select>`:`<input data-extra="alt-field" data-field="${k}" type="${k==='odds'?'number':k==='kickoff'?'datetime-local':'text'}" ${k==='odds'?'min="1.01" step="0.01"':''} value="${H(t.alternate.legs[0][k]??'')}"/>`}</label>`).join('')}</div></section>`:''}</section><section class="panel mt-2"><div class="section-head"><h2 class="panel-title">Сравнение за сезон</h2><span class="pill">${paired.length} сопоставимых туров</span></div><div class="flex between"><span class="muted">Наше преимущество относительно оригинала</span><strong class="${aggregate>=0?'positive':'negative'}">${paired.length?money(aggregate):'Н/Д'}</strong></div><div class="table-scroll"><table class="table"><thead><tr><th>Дата</th><th>Оригинал</th><th>Наш выбор</th><th>Разница</th></tr></thead><tbody>${paired.length?paired.map(x=>`<tr><td>${H(x.day)}</td><td>${money(x.original)}</td><td>${money(x.chosen)}</td><td class="${x.delta>=0?'positive':'negative'}">${money(x.delta)}</td></tr>`).join(''):'<tr><td colspan="4">Ещё нет закрытых туров с результатами обеих стратегий.</td></tr>'}</tbody></table></div><p class="footnote">Прибыль на малой выборке может возникнуть случайно. Для доказательства EV потребуется независимое тестирование на новых матчах.</p></section>`;}
function importView(){const t=B.data().tours[duelDay]||E.emptyTour(duelDay);return subtitle('Скриншоты и импорт','Сохраняем исходный купон и автоматически извлекаем текст при наличии локального OCR. Прежде чем создавать ноги, проверяем их вручную.')+`<section class="panel mt-3">${dayPicker()}<div class="source-grid mt-3"><div><h2 class="panel-title">Исходный скриншот</h2><p class="muted small">Преобразуем изображение в сжатую локальную копию. SHA-256 вычисляется по исходному файлу, если браузер поддерживает Web Crypto. Не загружаем изображение в БК или аналитические сервисы.</p><input id="ticket-file" type="file" accept="image/png,image/jpeg,image/webp" hidden/>${button('choose-ticket','▤ Выбрать фото купона','secondary')}${t.ticket?.preview?`<figure class="ticket-figure"><img src="${H(t.ticket.preview)}" alt="Сжатое изображение купона"><figcaption>${H(t.ticket.filename)} · SHA-256: ${H(t.ticket.sha256||'недоступен')}</figcaption></figure>`:`<div class="empty small-empty mt-2">Для ${H(duelDay)} нет прикреплённого купона.</div>`}${t.ticket?.preview&&t.state==='draft'?`<div class="actions-row">${button('remove-ticket','Удалить фото','danger')}</div>`:''}</div><div><h2 class="panel-title">Текст купона</h2><p class="muted small">OCR работает в браузере после загрузки внешней библиотеки Tesseract (нужен интернет). Фото не отправляется на сервер распознавания. Результат обязательно сверяем с изображением.</p>${t.ticket?.preview&&t.state==='draft'?button('ocr-ticket',loadingOCR?'Распознаётся…':'Распознать OCR','secondary'):''}<label class="field mt-2"><span>Распознанный / вставленный текст</span><textarea id="ticket-text" rows="9" ${t.state!=='draft'?'readonly':''} placeholder="Текст после OCR или список строк формата: Команда A | Команда B | Тотал | ТБ 2.5 | 1.75 | 2026-12-04T21:00">${H(t.ticket?.ocrText||'')}</textarea></label>${t.state==='draft'?`<div class="actions-row">${button('save-ticket-text','Сохранить текст','secondary')}${button('parse-ticket','Разобрать строки и заполнить тур','')}</div>`:''}</div></div><div class="notice warn mt-2">Формат импорта: «Хозяева | Гости | Рынок | Исход | КФ | YYYY-MM-DDTHH:mm», одна строка — одна нога, до 3 ног. Импорт из OCR только после проверки: рынок, счёт, время и коэффициенты легко распознаются неверно. P модели не создаём.</div></section>`;}
// ------- Cloud sync, user-owned RLS row. No service keys or bookmaker connection. -------
function sessionInfo(){try{return JSON.parse(sessionStorage.getItem(SESS)||'null');}catch{return null;}}
function storeSession(obj){cloud.session=obj?{access_token:obj.access_token,refresh_token:obj.refresh_token,expires_at:(Math.floor(Date.now()/1000)+(obj.expires_in||3600))}:null;try{if(cloud.session)sessionStorage.setItem(SESS,JSON.stringify(cloud.session));else sessionStorage.removeItem(SESS);}catch{}}
function stripForCloud(){return JSON.stringify(B.data());}
function canSync(){return cloud.session&&cloud.userId&&cloud.ready&&!cloud.conflict&&!cloud.busy;}
async function sb(path,options={},authenticated=false){const api={...options,headers:{apikey:PUBLISHABLE, 'Content-Type':'application/json', ...(options.headers||{})}};if(authenticated){await refreshTokenIfNeeded();api.headers.Authorization='Bearer '+cloud.session.access_token;}const res=await fetch(DB_URL+path,api);let json;const raw=await res.text();try{json=raw?JSON.parse(raw):null;}catch{json=raw;}if(!res.ok)throw Error((json?.msg||json?.message||json?.error_description||json?.error||'Ошибка соединения')+' ('+res.status+')');return json;}
async function refreshTokenIfNeeded(){if(!cloud.session)throw Error('Войди в аккаунт.');if(cloud.session.expires_at>Date.now()/1000+60)return;const x=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:cloud.session.refresh_token})},false);storeSession(x);}
async function cloudLogin(email,password,signup=false){if(cloud.busy)return;cloud.busy=true;cloud.status='Проверяем вход…';try{
 const d=await sb(signup?'/auth/v1/signup':'/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify(signup?{email,password}:{email,password})});
 if(!d?.access_token){cloud.status='Регистрация отправлена. Подтверди email и затем войди.';say(cloud.status);return;}
 storeSession(d);const user=d.user||await sb('/auth/v1/user',{method:'GET'},true);cloud.userId=user.id;cloud.status='Авторизован. Проверь облачную копию.';await cloudProbe();say('Вход выполнен.');
 }catch(e){cloud.status='Ошибка входа: '+e.message;say(cloud.status,true);}finally{cloud.busy=false;B.refresh();}}
async function cloudProbe(){if(!cloud.session||!cloud.userId)return;const rows=await sb(`/rest/v1/${TABLE}?select=payload,updated_at&user_id=eq.${encodeURIComponent(cloud.userId)}`,{method:'GET'},true);cloud.remote=rows?.[0]||null;cloud.stamp=rows?.[0]?.updated_at||null;cloud.ready=false;cloud.conflict=false;cloud.status=rows?.length?'Найдена облачная копия. Выбери действие, чтобы избежать перезаписи.':'Облачной копии ещё нет. Можно выгрузить локальную.';}
async function cloudPull(){if(!cloud.userId)return;if(!window.confirm('Заменить данные этого устройства облачной копией? Перед заменой будет скачана резервная копия.'))return;try{const rows=await sb(`/rest/v1/${TABLE}?select=payload,updated_at&user_id=eq.${encodeURIComponent(cloud.userId)}`,{},true);if(!rows?.length)throw Error('Облачная копия не найдена.');B.exportFile('quest_backup_before_cloud_restore.json',stripForCloud(),'application/json');restoring=true;B.replace(rows[0].payload);restoring=false;cloud.stamp=rows[0].updated_at;cloud.remote=rows[0];cloud.ready=true;cloud.conflict=false;cloud.status='Загружено из облака; автоматическая синхронизация включена.';cloud.lastSync=now();say('Журнал загружен из облака.');}catch(e){restoring=false;cloud.status='Ошибка загрузки: '+e.message;say(cloud.status,true);}finally{B.refresh();}}
async function cloudPush({force=false}={}){if(!cloud.userId||cloud.busy)return;cloud.busy=true;try{
 const stamp=new Date().toISOString(),payload=B.data();let rows;
 if(!cloud.stamp){rows=await sb(`/rest/v1/${TABLE}`,{method:'POST',headers:{Prefer:'return=representation'},body:JSON.stringify({user_id:cloud.userId,payload,updated_at:stamp,schema_version:2})},true);}
 else{rows=await sb(`/rest/v1/${TABLE}?user_id=eq.${encodeURIComponent(cloud.userId)}&updated_at=eq.${encodeURIComponent(cloud.stamp)}`,{method:'PATCH',headers:{Prefer:'return=representation'},body:JSON.stringify({payload,updated_at:stamp,schema_version:2})},true);
  if(!Array.isArray(rows)||!rows.length){cloud.conflict=true;cloud.ready=false;cloud.status='Конфликт изменений: облачная версия обновилась с другого устройства. Не перезаписываем.';say(cloud.status,true);return;}}
 cloud.stamp=rows[0].updated_at;cloud.remote={updated_at:cloud.stamp};cloud.ready=true;cloud.conflict=false;cloud.lastSync=now();cloud.status='Синхронизировано: '+new Date().toLocaleTimeString('ru-RU');
 }catch(e){cloud.status='Сбой синхронизации: '+e.message;cloud.ready=false;say(cloud.status,true);}finally{cloud.busy=false;if(location.hash.startsWith('#sync'))B.refresh();}}
function queueSync(){if(restoring||!canSync())return;clearTimeout(pendingTimer);pendingTimer=setTimeout(()=>cloudPush(),1400);}
async function cloudStart(){if(!cloud.userId)return;say('Загружаем локальные данные в защищённое облако.');await cloudPush();}
function cloudLogout(){storeSession(null);cloud={session:null,userId:null,stamp:null,remote:false,ready:false,busy:false,status:'Выход выполнен.',lastSync:null,conflict:false};B.refresh();}
function syncView(){return subtitle('Облачный журнал','Приватная синхронизация через Supabase Auth + RLS. Данные доступны твоей учётной записи, а не всем пользователям сайта.')+`<section class="panel mt-3"><div class="section-head"><h2 class="panel-title">Состояние подключения</h2><span class="pill ${cloud.ready?'good':cloud.conflict?'danger':'neutral'}">${cloud.ready?'SYNC ON':cloud.session?'ОЖИДАЕТ ВЫБОРА':'OFFLINE'}</span></div><div class="notice ${cloud.conflict?'error':cloud.ready?'success':'warn'}">${H(cloud.status)}</div>${!cloud.session?`<div class="form-grid two mt-2"><label class="field"><span>Email для Supabase Auth</span><input id="cloud-email" type="email" autocomplete="username" placeholder="your@email.com"/></label><label class="field"><span>Пароль (не сохраняется сайтом)</span><input id="cloud-password" type="password" autocomplete="current-password" minlength="8"/></label></div><div class="actions-row mt-2">${button('cloud-login','Войти')}${button('cloud-signup','Создать аккаунт','secondary')}</div><p class="footnote">Аккаунт может потребовать подтверждения email. Пароль не передаётся в ChatGPT. Сессия хранится только в текущей вкладке браузера.</p>`:`<div class="actions-row mt-2">${button('cloud-pull','↓ Получить из облака','secondary')}${button('cloud-push','↑ Сохранить в облако')}${button('cloud-probe','Проверить изменения','secondary')}${button('cloud-logout','Выйти','danger')}</div><div class="mt-2 muted small">ID пользователя для привязки помощника: <code>${H(cloud.userId||'')}</code>. Не передавай сюда пароль или токены. Последняя синхронизация: ${H(cloud.lastSync||'ещё нет')}.</div>${cloud.ready?'<p class="footnote">Автообновление включено после сохранения. Если две вкладки меняют данные одновременно, автоматическая запись блокируется и требует разрешения конфликта.</p>':''}`}</section><section class="panel mt-2"><h2 class="panel-title">Безопасность и ограничения</h2><ul class="rule-list mt-2"><li>Создана отдельная таблица, не изменяющая таблицы модели SEFIROT.</li><li>Доступ к строке только владельцу через auth.uid(), анонимное чтение запрещено.</li><li>Не подключено к букмекерским конторам, платным API или реальным ставкам.</li><li>Синхронизируется JSON-журнал, включая сжатые превью купонов, если они сохранены.</li><li>Локальный HTML может быть ограничен политикой браузера. Для постоянного использования рекомендован HTTPS-хостинг.</li></ul></section>`;}

function applyImportText(raw){const lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&x.includes('|'));if(!lines.length)throw Error('Не нашёл ни одной строки с разделителем |.');if(lines.length>3)throw Error('В одном экспрессе максимум три события.');const legs=lines.map(line=>{const cells=line.split('|').map(x=>x.trim());if(cells.length<6)throw Error('Ожидается 6 колонок: команды, рынок, исход, КФ, дата.');const [home,away,rawMarket,pick,odd,kickoff]=cells;const aliases={'ИТ':'Индивидуальный тотал','ИТБ':'Индивидуальный тотал','ТБ':'Тотал','1Х2':'1X2','1x2':'1X2','DC':'Двойной шанс','Фолы':'Фолы','ЖК':'ЖК','ОЗ':'ОЗ'};const market=aliases[rawMarket]||rawMarket;const odds=Number(odd.replace(',','.'));if(!home||!away||!pick||!E.markets.includes(market)||!(odds>1)||!/^2026-12-\d\dT\d\d:\d\d/.test(kickoff)||Number(kickoff.slice(8,10))>31)throw Error('Проверь команды, рынок, дату и КФ в строке: '+line.slice(0,70));return {...E.emptyLeg(),home,away,market,pick,odds,kickoff:kickoff.slice(0,16),prob:null};});return legs;}

 if(['paid','reviewed'].includes(field))e[field]=!!checked;
 save();}
function seal(id){const f=fixtureList.find(x=>x.id===id);if(!f)return;if(started(f)){lastMsg='Начало матча уже наступило: прематч-запись заблокирована.';return;}const e=get(id);
 if(e.seal){lastMsg='Эта запись уже зафиксирована';return;}
 if(!e.market||!e.selection.trim()||!(e.odds>1)||!e.reviewed||e.note.trim().length<25){lastMsg='Нужны проверенный рынок, исход, коэффициент >1, ссылка на данные и разбор минимум 25 символов. Без этих данных — PASS.';return;}
 if(e.market==='ЖК'){lastMsg='Строгий Referee Gate недоступен без YC/game, YC/foul, проверки низкой интенсивности и рынка фолов. ЖК — PASS.';return;}
 const contents=JSON.stringify({fixture:id,kickoff:f.kickoff,market:e.market,selection:e.selection,odds:e.odds,probability:e.probability,note:e.note,paid:e.paid,reviewed:e.reviewed});
 e.seal={at:new Date().toISOString(),hash:'local-only',contents};save();lastMsg='Тестовый прогноз записан до начала матча. Это локальная фиксация без доверенного времени.';
}
function testEngine(){let passed=0,errors=[];const check=(name,test)=>{try{if(!test())throw Error('не совпало');passed++;}catch(e){errors.push(`${name}: ${e.message}`);}};
 const sample=(odds,prob,status='pending',home='A',away='B')=>({...E.emptyLeg(),home,away,kickoff:'2026-12-09T19:00',market:'1X2',pick:'1',odds,prob,status});
 const t=E.emptyTour('2026-12-09');t.purchased=true;t.mode='original';t.legs=[sample(2,60,'pending','A','B'),sample(2.5,50,'pending','C','D')];t.independenceReviewed=true;t.decisionNote='Предматчевый анализ, без фальшивых оценок';const s={stake:1000,price:350};
 check('coeff',()=>E.odds(t)===5);
 check('implied',()=>Math.abs(1/E.odds(t)-.2)<1e-9);
 check('model P',()=>Math.abs(E.modelP(t)-.3)<1e-9);
 check('EV',()=>E.ev(t,s)===150);
 check('seal future',()=>E.validateSeal(t,new Date('2026-11-23T17:00:00Z')).length===0);
 check('pending',()=>E.payout(t,s)===null);
 t.legs[0].status='win';t.legs[1].status='win';check('win',()=>E.payout(t,s)===5000);
 t.legs[0].status='lose';check('lose',()=>E.payout(t,s)===0);
 t.legs[0].status='return';check('return',()=>E.payout(t,s)===2500);
 t.legs[0].status='half-win';check('half-win',()=>E.payout(t,s)===3750);
 t.legs[0].status='half-loss';check('half-loss',()=>E.payout(t,s)===1250);
 t.legs[0].status='pending';t.legs[1].status='pending';check('no settlement',()=>E.pnl(t,s)===null);
 t.legs[0].prob=null;check('unknown P',()=>E.ev(t,s)===null);t.legs[0].prob=60;
 t.legs[1].home='A';t.legs[1].away='B';check('correlation',()=>E.modelP(t)===null);t.legs[1].home='C';t.legs[1].away='D';
 t.legs[0].kickoff='2026-11-20T19:00';check('late seal',()=>E.validateSeal(t,new Date('2026-11-23T17:00:00Z')).some(x=>x.includes('kickoff')));t.legs[0].kickoff='2026-12-09T19:00';
 t.legs[0].market='ЖК';check('referee gate',()=>E.validateSeal(t,new Date('2026-11-23T17:00:00Z')).some(x=>x.includes('Referee Gate')));
 const pass=E.emptyTour('2026-12-09');pass.mode='pass';pass.purchased=true;pass.decisionNote='No verified edge';check('paid PASS',()=>E.pnl(pass,s)===-350);
 return {total:passed+errors.length,passed,failed:errors.length,errors};}
function exportLab(){const report={schema:'sefirot-nov23-lab-v1',generatedAt:new Date().toISOString(),currency:'UAH',moneyStaked:0,fixtures:fixtureList.map(f=>({...f,entry:get(f.id),result:'NOT_SETTLED',recommendation:'PASS: no verified EV'})),technicalTests:testResults};B.exportFile('SEFIROT_Lab_2026-11-23.json',JSON.stringify(report,null,2),'application/json');}
document.addEventListener('input',ev=>{const el=ev.target;if(!el.matches('[data-lab-field]'))return;if(el.type==='checkbox'||el.tagName==='SELECT')return;setField(el.dataset.labId,el.dataset.labField,el.value,false);});
document.addEventListener('change',ev=>{const el=ev.target;if(!el.matches('[data-lab-field]'))return;if(el.type!=='checkbox'&&el.tagName!=='SELECT')return;setField(el.dataset.labId,el.dataset.labField,el.value,el.checked);B.refresh();});
document.addEventListener('click',ev=>{const el=ev.target.closest('[data-lab-act]');if(!el)return;const x=el.dataset.labAct;if(x==='save'){lastMsg=save()?'Черновик лаборатории сохранён отдельно от декабрьского сезона.':'Браузер заблокировал хранилище; экспортируй JSON.';}else if(x==='seal')seal(el.dataset.labId);else if(x==='run-tests') {testResults=testEngine();lastMsg='Синтетические проверки выполнены; результаты матчей не использовались.';}else if(x==='export'){exportLab();lastMsg='Экспортирован отдельный отчёт лаборатории.';}B.refresh();});
window.QuestLab={view,fixtureList,testEngine,readLab:()=>structuredClone(stored)};
})();

  <script>
/* SEFIROT V3: reviewable assistant-to-website transfer. No APIs/automatic payments/seal. */
(() => {
'use strict';
const B=window.questBridge,E=window.SEQ,Q=window.QuestExtra,h=B.escape;
let preview=null, error='';

const verdicts=['играбельно','неиграбельно','только с оговорками','пропуск'];
const m=['original','corrected','single','pass'];
function validLeg(o,i){if(!o||typeof o!=='object')throw Error(`Нога ${i+1}: некорректный объект`);
 const home=String(o.home||'').trim().slice(0,150),away=String(o.away||'').trim().slice(0,150),market=String(o.market||'');
 const odds=(o.odds===null||o.odds===undefined||o.odds==='')?null:Number(o.odds);
 const prob=(o.prob===null||o.prob===undefined||o.prob==='')?null:Number(o.prob);
 const kickoff=String(o.kickoff||'').slice(0,16),pick=String(o.pick||'').slice(0,140);
 if(!home||!away||home.toLowerCase()===away.toLowerCase()||!E.markets.includes(market)||!pick||!/^2026-12-\d\dT\d\d:\d\d$/.test(kickoff))throw Error(`Нога ${i+1}: проверь команды, рынок, исход, время в декабре`);
 if(odds!==null&&!(Number.isFinite(odds)&&odds>1&&odds<=10000))throw Error(`Нога ${i+1}: неверный коэффициент`);
 if(prob!==null&&!(Number.isFinite(prob)&&prob>0&&prob<=100))throw Error(`Нога ${i+1}: P модели вне диапазона`);
 const source=(Array.isArray(o.sources)?o.sources:[]).filter(s=>typeof s==='string'&&/^https:\/\//.test(s)).slice(0,4);
 const notes=[String(o.notes||'').slice(0,2000),source.length?`Источники: ${source.join('; ')}`:'', 'Импорт V3: данные помощника требуют проверки перед PREMATCH SEAL.'].filter(Boolean).join('\n').slice(0,3000);
 return {...E.emptyLeg(),home,away,market,pick,odds,prob,kickoff,fixtureId:String(o.fixtureId||'').slice(0,100),notes};}
function validate(o){if(!o||typeof o!=='object'||o.schema!=='sefirot-agent-packet-v1'||o.season!=='2026-12'||!E.days.includes(o.date)||!m.includes(o.mode))throw Error('Неверный формат пакета: ожидается sefirot-agent-packet-v1, сезон 2026-12 и дата декабря.');
 if(!Array.isArray(o.legs)||o.legs.length>3)throw Error('Нужно 0–3 ноги.');
 const legs=o.legs.map(validLeg);if(o.mode==='pass'&&legs.length)throw Error('PASS не содержит ставок.');
 if(o.mode==='single'&&legs.length!==1)throw Error('Для ординара нужна одна нога.');
 if(['original','corrected'].includes(o.mode)&&legs.length<2)throw Error('Для экспресса нужны 2–3 ноги.');
 if(legs.length>1&&!E.independent(legs))throw Error('Найдены повторяющиеся матчи (корреляция).');
 const decisionNote=String(o.decisionNote||'').slice(0,5000),review=String(o.review||'').slice(0,2000);
 if(o.mode==='pass'&&!decisionNote.trim())throw Error('Для PASS обязательно обоснование.');
 return {date:o.date,mode:o.mode,legs,purchased:!!o.purchased,riskClass:knownClasses.includes(o.riskClass)?o.riskClass:'D',verdict:verdicts.includes(o.verdict)?o.verdict:'пропуск',decisionNote,review,preparedAt:String(o.preparedAt||'').slice(0,60),source:'аналитический пакет помощника, без автоматического seal'};}
function card(){return `<section class="panel mt-2 agent-box"><div class="section-head"><h2 class="panel-title">Импорт анализа от помощника</h2><span class="pill neutral">V3 · Ручная проверка</span></div>
<p class="agent-tip">Пришли купон в чат, получи JSON-пакет с проверенными рынками и источниками, загрузи его сюда. Пакет заполняет <strong>только черновик</strong> декабря: не расходует реальные деньги, не меняет закрытые записи и не создаёт ложную фиксацию.</p>
<div class="agent-actions"><button type="button" class="button secondary" data-agent="copy-query">Скопировать запрос на анализ</button><button type="button" class="button ghost" data-agent="example">Показать формат</button></div>
<label class="field"><span>JSON из чата или файла</span><textarea rows="6" id="agent-packet" placeholder="{\"schema\":\"sefirot-agent-packet-v1\",...}"></textarea></label>
<input type="file" id="agent-file" accept=".json,application/json"><div class="agent-actions"><button type="button" class="button secondary" data-agent="verify">Проверить пакет</button><button type="button" class="button" data-agent="import" ${preview?'':'disabled'}>Импортировать в черновик</button></div>
${preview?`<div class="notice success">Проверен формат: ${h(preview.date)} · ${h(preview.mode)} · ${preview.legs.length} событий. ${preview.legs.filter(l=>l.prob===null).length} ног без P модели. Нужно вручную проверить источник и линию.</div><pre class="agent-preview">${h(JSON.stringify({date:preview.date,mode:preview.mode,legs:preview.legs.map(l=>({home:l.home,away:l.away,market:l.market,pick:l.pick,odds:l.odds,prob:l.prob}))},null,2))}</pre>`:''}
${error?`<div class="notice error mt-2">${h(error)}</div>`:''}<p class="tiny mt-2">Не вставляй в JSON API-ключи, пароли или токены. Импорт не подтверждает EV и не заменяет проверку Referee Gate.</p></section>`;}
const original=Q.importView;Q.importView=function(){return original()+card();};
function example(){return JSON.stringify({schema:'sefirot-agent-packet-v1',season:'2026-12',date:'2026-12-01',mode:'pass',purchased:false,riskClass:'D',verdict:'пропуск',preparedAt:'',decisionNote:'Нет подтверждённого рынка с положительным EV, поэтому PASS.',legs:[]},null,2);}
function userRequest(){return 'SEFIROT December Quest: проведи полный PREMATCH-анализ экспресса, который я пришлю. Проверь даты/матчи/3 ноги/коэффициенты, tactical fit, public trap, death-test, альтернативы main markets и EV только по независимым подтверждённым вероятностям. Если value нет — PASS. Подготовь машиночитаемый JSON со схемой sefirot-agent-packet-v1, season 2026-12, date YYYY-MM-DD, mode original/corrected/single/pass, purchased, riskClass, verdict, decisionNote, legs [home,away,fixtureId,kickoff YYYY-MM-DDTHH:mm Europe/Kyiv,market,pick,odds,prob,notes,sources]. Не выдумывай данные. До начала матчей и без реальной ставки.';}
function push(){if(!preview)return;const data=B.data();const existing=data.tours[preview.date];if(existing&&existing.state!=='draft'){error='Запечатанный или закрытый тур нельзя переписывать.';B.refresh();return;}
 if(!window.confirm(`Заполнить ${preview.date} проверенным форматом (но НЕ подтверждёнными вероятностями)? ${existing?'Существующий черновик будет заменён.':'Будет создан новый черновик.'}`))return;
 const t=E.emptyTour(preview.date);t.mode=preview.mode;t.legs=preview.legs;t.purchased=preview.purchased;t.riskClass=preview.riskClass;t.verdict=preview.verdict;t.decisionNote=preview.decisionNote;t.review='';t.independenceReviewed=false;t.state='draft';t.audit=[{at:new Date().toISOString(),action:'AGENT PACKET IMPORT / UNVERIFIED'}];t.updatedAt=new Date().toISOString();data.tours[preview.date]=t;B.save();error='';preview=null;B.go('tour',t.date);B.toast('Черновик заполнен. Проверь данные, независимость, Referee Gate и зафиксируй самостоятельно.');}
document.addEventListener('click',async ev=>{const target=ev.target.closest('[data-agent]');if(!target)return;const act=target.dataset.agent;
 if(act==='example'){const el=document.getElementById('agent-packet');if(el){el.value=example();el.focus();}preview=null;error='';const btn=document.querySelector('[data-agent=import]');if(btn)btn.disabled=true;B.toast('Показан пример PASS. Это не реальный прогноз.');return;}

 if(act==='verify'){try{const raw=document.getElementById('agent-packet')?.value||'';if(raw.length>120000)throw Error('Пакет слишком большой.');preview=validate(JSON.parse(raw));error='';}catch(e){preview=null;error=String(e.message);}B.refresh();return;}

});
