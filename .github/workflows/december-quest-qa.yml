name: December Quest staging QA

on:
  push:
    branches: [feature/december-quest-v63-autonomous]
    paths:
      - 'december-quest-site/**'
      - '.github/workflows/december-quest-qa.yml'

  pull_request:
    branches: [feature/december-quest-web-v3-20261123, work/offline-market-optimization, work/p2-predictor-single-flight]
    types: [opened, synchronize, reopened]
    paths:
      - 'december-quest-site/**'
      - '.github/workflows/december-quest-qa.yml'

permissions:
  contents: read

jobs:
  postgres-and-node:
    if: github.event_name != 'pull_request' || github.head_ref == 'feature/december-quest-v63-autonomous' || contains(fromJSON('["work/offline-market-optimization","work/p2-predictor-single-flight"]'), github.base_ref)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: denoland/setup-deno@v2
        with:
          deno-version: '2.5.6'
      - name: Install pinned staging test dependency
        run: npm ci --ignore-scripts --prefix december-quest-site/autonomous
      - name: Engine and database acceptance
        run: |
          npm --prefix december-quest-site/autonomous test
          npm --prefix december-quest-site/autonomous run test:acceptance
          npm --prefix december-quest-site/autonomous run test:edge
          node december-quest-site/autonomous/test/recovery.mjs
      - name: Site regressions
        run: node --test december-quest-site/tests/*.test.cjs
      - name: Offline PostgreSQL multi-process load and recovery
        if: contains(fromJSON('["work/offline-market-optimization","work/p2-predictor-single-flight"]'), github.base_ref)
        run: |
          npm install --ignore-scripts --no-audit --prefix "$RUNNER_TEMP/dq-load" embedded-postgres@19.0.0-beta.20 pg@8.23.1
          NODE_PATH="$RUNNER_TEMP/dq-load/node_modules" node december-quest-site/autonomous/test/cycle-load.mjs
      - name: Live public CSV source check
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/december-quest-v63-autonomous'
        continue-on-error: true
        run: deno run --quiet --allow-net=football-data.co.uk:443 december-quest-site/autonomous/test/public-source.mjs

  native-scheduler:
    if: github.base_ref == 'work/p2-predictor-single-flight'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise pg_cron and pg_net in an isolated container
        run: bash december-quest-site/autonomous/test/native-cron.sh
