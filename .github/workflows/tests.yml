name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
        include:
          - os: ubuntu-latest
            python-version: '3.14.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local PostgreSQL WASM test dependency
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install optional cloud sync dependency
        run: python -m pip install ".[sync]"
      - name: Unit and integration tests
        run: python test_sefirot.py
      - name: Full synthetic lifecycle
        run: python sefirot.py demo
      - name: Full release verification
        run: python scripts/verify_release.py
  postgres-sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14.3']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefirot_sync_test
          POSTGRES_PASSWORD: sefirot-local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefirot_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional cloud sync dependency
        run: python -m pip install ".[sync]"
      - name: Isolated PostgreSQL mirror, rollback and role permissions
        env:
          # This password belongs only to the disposable local service container.
          SEFIROT_TEST_POSTGRES_DSN: postgresql://postgres:sefirot-local-ci-only@127.0.0.1:5432/sefirot_sync_test
        run: python -m unittest discover -s tests -p test_postgres_sync.py -v
  postgres-probe:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.13', '3.14.3']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: sefirot_probe_test
          POSTGRES_PASSWORD: sefirot-local-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sefirot_probe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional cloud sync dependency
        run: python -m pip install ".[sync]"
      - name: Isolated PostgreSQL probe fencing, replay and role permissions
        env:
          # This password belongs only to the disposable local service container.
          SEFIROT_TEST_PROBE_POSTGRES_DSN: postgresql://postgres:sefirot-local-ci-only@127.0.0.1:5432/sefirot_probe_test
        run: python -m unittest discover -s tests -p test_postgres_probe_completion.py -v
