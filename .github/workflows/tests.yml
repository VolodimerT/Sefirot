name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install optional cloud sync dependency
        run: python -m pip install ".[sync]"
      - name: Unit and integration tests
        run: python test_sefirot.py
      - name: Full synthetic lifecycle
        run: python sefirot.py demo
