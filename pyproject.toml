[project]
name = "sefirot-core"
version = "2.1.0"
description = "Independent prematch analysis, immutable audit and calibration"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
sefirot = "sefirot.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
